name: Generate Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch: 

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Pacman Contribution Graphs
        run: |
          mkdir -p pacman-output
          
          npx -y pacman-contribution-graph --platform github --username ${{ github.repository_owner }} --gameTheme github-dark --output pacman-output/pacman-contribution-graph-dark.svg
          
          npx -y pacman-contribution-graph --platform github --username ${{ github.repository_owner }} --gameTheme github --output pacman-output/pacman-contribution-graph.svg

      - name: Deploy Pacman
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pacman-output
          publish_branch: pacman-output
          force_orphan: true
